<div class="fsbox lb" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged illustration">
  <button class="fsclose" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
  <img class="lbimg" alt="">
  <div class="fsbar"><button class="ctl prev" aria-label="Previous image"><img src="../assets/ui/arrow-left.svg" alt=""></button><span class="count"></span><button class="ctl next" aria-label="Next image"><img src="../assets/ui/arrow-right.svg" alt=""></button></div>
</div>
<script>
(function(){
  var tiles=[].slice.call(document.querySelectorAll('.tile')),lb=document.getElementById('lb'),img=lb.querySelector('.lbimg'),
      count=lb.querySelector('.count'),cur=-1,opener=null,x0=null,y0=0;
  function show(i){cur=(i+tiles.length)%tiles.length;var t=tiles[cur];img.src=t.dataset.full;img.alt=t.querySelector('img').alt;
    count.textContent=(cur+1)+' / '+tiles.length;
    [cur+1,cur-1].forEach(function(k){var n=tiles[(k+tiles.length)%tiles.length];if(n){var p=new Image();p.src=n.dataset.full;}});}
  function open(i,btn){opener=btn;lb.classList.add('open');document.body.style.overflow='hidden';show(i);lb.querySelector('.fsclose').focus();}
  function close(){lb.classList.remove('open');document.body.style.overflow='';cur=-1;if(opener)opener.focus();}
  tiles.forEach(function(t,i){t.onclick=function(){open(i,t);};});
  lb.querySelector('.fsclose').onclick=close;
  lb.querySelector('.prev').onclick=function(){show(cur-1);};
  lb.querySelector('.next').onclick=function(){show(cur+1);};
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  lb.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;});
  lb.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))show(cur+(dx<0?1:-1));});
  lb.addEventListener('pointercancel',function(){x0=null;});
  document.addEventListener('keydown',function(e){if(cur<0)return;
    if(e.key==='Escape')close();else if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);});
})();
</script>
